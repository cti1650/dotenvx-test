name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dotenvx-check:
    name: dotenvx prebuild check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify .env files are encrypted and .env.keys is gitignored
        run: npx dotenvx ext prebuild
